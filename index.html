<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA STRIKE</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Share Tech Mono', monospace;
    overflow: hidden;
    user-select: none;
  }

  #title-screen {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, #0a0a1a 0%, #000 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }

  #title-screen h1 {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: clamp(2.5rem, 8vw, 5rem);
    letter-spacing: 0.3em;
    color: #00ffff;
    text-shadow: 0 0 20px #00ffff, 0 0 60px #00aaff, 0 0 100px #0044ff;
    animation: titlePulse 2s ease-in-out infinite alternate;
    margin-bottom: 0.2em;
  }

  #title-screen .subtitle {
    font-size: 0.85rem;
    color: #4466aa;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    margin-bottom: 3rem;
  }

  @keyframes titlePulse {
    from { text-shadow: 0 0 20px #00ffff, 0 0 40px #00aaff; }
    to   { text-shadow: 0 0 30px #00ffff, 0 0 80px #00aaff, 0 0 120px #0055ff; }
  }

  .controls-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem 2.5rem;
    margin-bottom: 2.5rem;
    border: 1px solid #1a2a4a;
    padding: 1.5rem 2rem;
    background: rgba(0,40,80,0.25);
  }

  .ctrl { color: #88aacc; font-size: 0.78rem; line-height: 1.8; }
  .ctrl span { color: #00ffff; }

  #start-btn {
    font-family: 'Orbitron', sans-serif;
    font-size: 1rem;
    letter-spacing: 0.25em;
    color: #000;
    background: #00ffff;
    border: none;
    padding: 0.85em 2.5em;
    cursor: pointer;
    clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
    transition: background 0.15s, transform 0.1s;
    text-transform: uppercase;
  }
  #start-btn:hover { background: #fff; transform: scale(1.04); }

  #game-wrapper {
    position: relative;
    display: none;
  }

  canvas {
    display: block;
    background: #000;
  }

  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    pointer-events: none;
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .hud-box {
    background: rgba(0,0,0,0.65);
    border: 1px solid rgba(0,255,255,0.18);
    padding: 6px 14px;
    font-family: 'Orbitron', sans-serif;
  }

  .hud-label { font-size: 0.55rem; letter-spacing: 0.2em; color: #3366aa; text-transform: uppercase; }
  .hud-value { font-size: 1.1rem; color: #00ffff; letter-spacing: 0.1em; }

  .heart { color: #ff3355; font-size: 1.1rem; }
  .heart.lost { color: #2a1020; }

  #powerup-bar {
    position: absolute;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Orbitron', sans-serif;
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    color: #ffdd00;
    text-shadow: 0 0 10px #ffaa00;
    background: rgba(0,0,0,0.7);
    padding: 5px 16px;
    border: 1px solid rgba(255,200,0,0.35);
    display: none;
    pointer-events: none;
  }

  #gameover-screen {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  #gameover-screen.visible {
    display: flex;
    pointer-events: auto;
  }

  #gameover-screen h2 {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(2rem, 6vw, 3.5rem);
    color: #ff3355;
    letter-spacing: 0.2em;
    text-shadow: 0 0 30px #ff0033;
    margin-bottom: 0.3em;
  }

  #final-score {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.1rem;
    color: #aaccff;
    margin-bottom: 2rem;
    letter-spacing: 0.15em;
  }

  #restart-btn {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.9rem;
    letter-spacing: 0.2em;
    color: #000;
    background: #ff3355;
    border: none;
    padding: 0.8em 2.2em;
    cursor: pointer;
    clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
    text-transform: uppercase;
    transition: background 0.15s, transform 0.1s;
  }
  #restart-btn:hover { background: #ff6688; transform: scale(1.04); }
</style>
</head>
<body>

<!-- Title Screen -->
<div id="title-screen">
  <h1>NOVA STRIKE</h1>
  <p class="subtitle">Vertical Shooter</p>
  <div class="controls-grid">
    <div class="ctrl"><span>W A S D / ↑ ↓ ← →</span><br>移動玩家</div>
    <div class="ctrl"><span>Space / 滑鼠左鍵</span><br>持續射擊</div>
    <div class="ctrl"><span>黃色星星</span><br>散彈升級道具</div>
    <div class="ctrl"><span>❤❤❤</span><br>3 條生命</div>
  </div>
  <button id="start-btn">▶ START GAME</button>
</div>

<!-- Game -->
<div id="game-wrapper">
  <canvas id="gameCanvas"></canvas>
  <div id="hud">
    <div class="hud-box">
      <div class="hud-label">Score</div>
      <div class="hud-value" id="score-display">0</div>
    </div>
    <div class="hud-box" style="text-align:right">
      <div class="hud-label">Lives</div>
      <div id="lives-display" class="hud-value"></div>
    </div>
  </div>
  <div id="powerup-bar">◈ SPREAD SHOT ACTIVE ◈</div>
  <div id="gameover-screen">
    <h2>GAME OVER</h2>
    <div id="final-score"></div>
    <button id="restart-btn">↺ RESTART</button>
  </div>
</div>

<script>
// ─── Canvas Setup ────────────────────────────────────────────────────────────
const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');

const W = 480, H = 640;
canvas.width  = W;
canvas.height = H;

// ─── DOM references ───────────────────────────────────────────────────────────
const titleScreen   = document.getElementById('title-screen');
const gameWrapper   = document.getElementById('game-wrapper');
const startBtn      = document.getElementById('start-btn');
const gameoverScreen= document.getElementById('gameover-screen');
const finalScore    = document.getElementById('final-score');
const restartBtn    = document.getElementById('restart-btn');
const scoreDisplay  = document.getElementById('score-display');
const livesDisplay  = document.getElementById('lives-display');
const powerupBar    = document.getElementById('powerup-bar');

// ─── Stars Background ─────────────────────────────────────────────────────────
const STARS = Array.from({length:120}, () => ({
  x: Math.random()*W, y: Math.random()*H,
  r: Math.random()*1.3+0.3,
  speed: Math.random()*0.4+0.1,
  alpha: Math.random()*0.7+0.3
}));

function drawStars() {
  STARS.forEach(s => {
    ctx.save();
    ctx.globalAlpha = s.alpha;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
    s.y += s.speed;
    if (s.y > H) { s.y = 0; s.x = Math.random()*W; }
  });
}

// ─── Game State ───────────────────────────────────────────────────────────────
let gameRunning = false;
let score, highScore = 0;
let frame;
let animId;

// Input state
const keys = {};
let mouseDown = false;

// Entities
let player, bullets, enemyBullets, enemies, powerups, particles;

// Timers
let enemySpawnTimer, enemySpawnInterval;
let shootTimer, shootCooldown;
let waveCount;

// ─── Player ───────────────────────────────────────────────────────────────────
function createPlayer() {
  return {
    x: W/2, y: H - 80,
    w: 20, h: 26,
    speed: 3.5,
    hp: 3,
    invincible: 0,       // frames of invincibility
    spreadShot: false,
    spreadTimer: 0,
    SPREAD_DURATION: 600 // 10 seconds at 60fps
  };
}

// ─── Utilities ────────────────────────────────────────────────────────────────
function rand(min, max) { return Math.random()*(max-min)+min; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function spawnParticles(x, y, color, count=8) {
  for (let i=0; i<count; i++) {
    const angle = rand(0, Math.PI*2);
    const speed = rand(1.5, 4);
    particles.push({
      x, y,
      vx: Math.cos(angle)*speed,
      vy: Math.sin(angle)*speed,
      r: rand(2, 5),
      color,
      life: 30,
      maxLife: 30
    });
  }
}

// ─── Drawing helpers ──────────────────────────────────────────────────────────
function drawTriangle(x, y, w, h, color, glowColor) {
  ctx.save();
  if (glowColor) {
    ctx.shadowColor = glowColor;
    ctx.shadowBlur  = 14;
  }
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x, y - h/2);
  ctx.lineTo(x - w/2, y + h/2);
  ctx.lineTo(x + w/2, y + h/2);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawEnemy(e) {
  ctx.save();
  ctx.shadowColor = '#ff3333';
  ctx.shadowBlur  = 12;
  ctx.fillStyle = '#cc1111';
  ctx.strokeStyle = '#ff4444';
  ctx.lineWidth = 1.5;
  const hw = e.w/2, hh = e.h/2;
  ctx.fillRect(e.x - hw, e.y - hh, e.w, e.h);
  ctx.strokeRect(e.x - hw, e.y - hh, e.w, e.h);
  // inner cross detail
  ctx.strokeStyle = 'rgba(255,100,100,0.5)';
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.moveTo(e.x - hw+3, e.y - hh+3);
  ctx.lineTo(e.x + hw-3, e.y + hh-3);
  ctx.moveTo(e.x + hw-3, e.y - hh+3);
  ctx.lineTo(e.x - hw+3, e.y + hh-3);
  ctx.stroke();
  ctx.restore();
}

function drawStar(x, y, r, color) {
  ctx.save();
  ctx.shadowColor = color;
  ctx.shadowBlur = 14;
  ctx.fillStyle = color;
  ctx.beginPath();
  const pts = 5;
  for (let i=0; i<pts*2; i++) {
    const angle = (i * Math.PI / pts) - Math.PI/2;
    const rad   = i%2===0 ? r : r*0.45;
    const px = x + Math.cos(angle)*rad;
    const py = y + Math.sin(angle)*rad;
    i===0 ? ctx.moveTo(px,py) : ctx.lineTo(px,py);
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawBullet(b) {
  ctx.save();
  ctx.shadowColor = b.color;
  ctx.shadowBlur  = 10;
  ctx.fillStyle   = b.color;
  ctx.beginPath();
  ctx.ellipse(b.x, b.y, b.w/2, b.h/2, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawParticles() {
  particles.forEach(p => {
    ctx.save();
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle   = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  });
}

// ─── Shoot ────────────────────────────────────────────────────────────────────
function playerShoot() {
  if (player.spreadShot) {
    const angles = [-0.3, -0.15, 0, 0.15, 0.3];
    angles.forEach(a => {
      bullets.push({
        x: player.x + Math.sin(a)*10,
        y: player.y - player.h/2,
        vx: Math.sin(a)*5,
        vy: -9,
        w: 5, h: 11,
        color: '#00ffcc'
      });
    });
  } else {
    bullets.push({
      x: player.x, y: player.y - player.h/2,
      vx: 0, vy: -10,
      w: 5, h: 12,
      color: '#00e5ff'
    });
  }
}

function enemyShoot(e) {
  const dx = player.x - e.x;
  const dy = player.y - e.y;
  const dist = Math.sqrt(dx*dx+dy*dy) || 1;
  const spd = 3.2 + waveCount * 0.12;
  enemyBullets.push({
    x: e.x, y: e.y + e.h/2,
    vx: (dx/dist)*spd,
    vy: (dy/dist)*spd,
    w: 7, h: 7,
    color: '#ff4400'
  });
}

// ─── Spawn enemy ──────────────────────────────────────────────────────────────
function spawnEnemy() {
  const x = rand(25, W-25);
  const hp = waveCount >= 5 ? 2 : 1;
  enemies.push({
    x, y: -20,
    w: 28, h: 28,
    speed: rand(0.6, 1.2) + waveCount*0.06,
    hp,
    maxHp: hp,
    shootTimer: Math.floor(rand(60, 140)),
    shootInterval: Math.floor(rand(80, 160))
  });
}

// ─── Init ────────────────────────────────────────────────────────────────────
function initGame() {
  score          = 0;
  frame          = 0;
  waveCount      = 0;
  player         = createPlayer();
  bullets        = [];
  enemyBullets   = [];
  enemies        = [];
  powerups       = [];
  particles      = [];
  enemySpawnTimer    = 0;
  enemySpawnInterval = 90;
  shootTimer     = 0;
  shootCooldown  = 12;
  updateHUD();
}

function updateHUD() {
  scoreDisplay.textContent = score;
  let html = '';
  for (let i=0; i<3; i++)
    html += `<span class="heart${i>=player.hp?' lost':''}">♥</span> `;
  livesDisplay.innerHTML = html;
}

// ─── Collision (AABB) ─────────────────────────────────────────────────────────
function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax - aw/2 < bx + bw/2 &&
         ax + aw/2 > bx - bw/2 &&
         ay - ah/2 < by + bh/2 &&
         ay + ah/2 > by - bh/2;
}

// ─── Player hurt ─────────────────────────────────────────────────────────────
function hurtPlayer() {
  if (player.invincible > 0) return;
  player.hp--;
  player.invincible = 120;
  spawnParticles(player.x, player.y, '#4488ff', 12);
  updateHUD();
  if (player.hp <= 0) endGame();
}

// ─── End Game ─────────────────────────────────────────────────────────────────
function endGame() {
  gameRunning = false;
  if (score > highScore) highScore = score;
  finalScore.textContent = `SCORE: ${score}   |   BEST: ${highScore}`;
  gameoverScreen.classList.add('visible');
}

// ─── Game Loop ────────────────────────────────────────────────────────────────
function update() {
  frame++;

  // Wave difficulty
  waveCount = Math.floor(score / 300);
  enemySpawnInterval = Math.max(40, 90 - waveCount * 4);

  // ── Player movement
  let dx = 0, dy = 0;
  if (keys['ArrowLeft']  || keys['a'] || keys['A']) dx -= 1;
  if (keys['ArrowRight'] || keys['d'] || keys['D']) dx += 1;
  if (keys['ArrowUp']    || keys['w'] || keys['W']) dy -= 1;
  if (keys['ArrowDown']  || keys['s'] || keys['S']) dy += 1;
  if (dx && dy) { dx *= 0.707; dy *= 0.707; }
  player.x = clamp(player.x + dx*player.speed, player.w/2, W - player.w/2);
  player.y = clamp(player.y + dy*player.speed, player.h/2, H - player.h/2);

  // ── Shooting
  const wantShoot = keys[' '] || keys['Space'] || mouseDown;
  if (wantShoot) {
    shootTimer--;
    if (shootTimer <= 0) {
      playerShoot();
      shootTimer = player.spreadShot ? 8 : shootCooldown;
    }
  } else {
    shootTimer = 0;
  }

  // ── Spread timer
  if (player.spreadShot) {
    player.spreadTimer--;
    if (player.spreadTimer <= 0) {
      player.spreadShot = false;
      powerupBar.style.display = 'none';
    }
  }

  // ── Invincibility countdown
  if (player.invincible > 0) player.invincible--;

  // ── Move bullets (player)
  for (let i = bullets.length-1; i>=0; i--) {
    const b = bullets[i];
    b.x += b.vx; b.y += b.vy;
    if (b.y < -20 || b.x < -20 || b.x > W+20) { bullets.splice(i,1); }
  }

  // ── Move bullets (enemy)
  for (let i = enemyBullets.length-1; i>=0; i--) {
    const b = enemyBullets[i];
    b.x += b.vx; b.y += b.vy;
    if (b.y > H+20 || b.x < -20 || b.x > W+20 || b.y < -20) {
      enemyBullets.splice(i,1); continue;
    }
    // Hit player?
    if (rectsOverlap(b.x, b.y, b.w, b.h, player.x, player.y, player.w, player.h)) {
      enemyBullets.splice(i,1);
      hurtPlayer();
    }
  }

  // ── Spawn enemies
  enemySpawnTimer++;
  if (enemySpawnTimer >= enemySpawnInterval) {
    spawnEnemy();
    enemySpawnTimer = 0;
  }

  // ── Move enemies
  for (let i = enemies.length-1; i>=0; i--) {
    const e = enemies[i];
    e.y += e.speed;

    // Enemy shoots
    e.shootTimer--;
    if (e.shootTimer <= 0) {
      enemyShoot(e);
      e.shootTimer = e.shootInterval;
    }

    // Off screen
    if (e.y > H + 30) { enemies.splice(i,1); continue; }

    // Collide with player
    if (rectsOverlap(e.x, e.y, e.w, e.h, player.x, player.y, player.w, player.h)) {
      enemies.splice(i,1);
      spawnParticles(e.x, e.y, '#ff3300', 10);
      hurtPlayer();
      continue;
    }

    // Hit by player bullets
    let killed = false;
    for (let j = bullets.length-1; j>=0; j--) {
      const b = bullets[j];
      if (rectsOverlap(b.x, b.y, b.w, b.h, e.x, e.y, e.w, e.h)) {
        bullets.splice(j,1);
        e.hp--;
        spawnParticles(b.x, b.y, '#ff6600', 4);
        if (e.hp <= 0) {
          score += 100;
          spawnParticles(e.x, e.y, '#ff3300', 12);
          // Drop powerup?
          if (Math.random() < 0.30) {
            powerups.push({ x: e.x, y: e.y, r: 10, vy: 0.9, spin: 0 });
          }
          enemies.splice(i,1);
          killed = true;
          updateHUD();
          break;
        }
      }
    }
    if (killed) continue;
  }

  // ── Move powerups
  for (let i = powerups.length-1; i>=0; i--) {
    const p = powerups[i];
    p.y += p.vy;
    p.spin += 0.05;
    if (p.y > H+20) { powerups.splice(i,1); continue; }
    // Player collect
    const dx2 = player.x - p.x, dy2 = player.y - p.y;
    if (Math.sqrt(dx2*dx2+dy2*dy2) < player.w/2 + p.r) {
      powerups.splice(i,1);
      player.spreadShot  = true;
      player.spreadTimer = player.SPREAD_DURATION;
      powerupBar.style.display = 'block';
      spawnParticles(p.x, p.y, '#ffdd00', 14);
    }
  }

  // ── Particles
  for (let i = particles.length-1; i>=0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.08;
    p.life--;
    if (p.life <= 0) particles.splice(i,1);
  }
}

function draw() {
  // Background
  ctx.fillStyle = '#05050f';
  ctx.fillRect(0, 0, W, H);

  // Scrolling nebula effect
  const ng = ctx.createLinearGradient(0,0,0,H);
  ng.addColorStop(0, 'rgba(10,0,40,0.6)');
  ng.addColorStop(1, 'rgba(0,5,20,0.6)');
  ctx.fillStyle = ng;
  ctx.fillRect(0,0,W,H);

  drawStars();
  drawParticles();

  // Powerups
  powerups.forEach(p => {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.spin);
    drawStar(0, 0, p.r, '#ffdd00');
    ctx.restore();
  });

  // Enemies
  enemies.forEach(e => {
    drawEnemy(e);
    // HP bar for tanky enemies
    if (e.maxHp > 1) {
      const bw = e.w;
      ctx.fillStyle = '#330000';
      ctx.fillRect(e.x - bw/2, e.y - e.h/2 - 6, bw, 3);
      ctx.fillStyle = '#ff4444';
      ctx.fillRect(e.x - bw/2, e.y - e.h/2 - 6, bw*(e.hp/e.maxHp), 3);
    }
  });

  // Bullets (player)
  bullets.forEach(b => drawBullet(b));

  // Bullets (enemy)
  enemyBullets.forEach(b => {
    ctx.save();
    ctx.shadowColor = '#ff4400';
    ctx.shadowBlur  = 12;
    ctx.fillStyle   = '#ff6600';
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.w/2, 0, Math.PI*2);
    ctx.fill();
    // Inner dot
    ctx.fillStyle = '#ffcc00';
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.w/4, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  });

  // Player (with invincibility blink)
  if (player.invincible === 0 || Math.floor(frame/5)%2 === 0) {
    // Engine glow
    ctx.save();
    ctx.shadowColor = '#0055ff';
    ctx.shadowBlur  = 18;
    ctx.fillStyle   = 'rgba(0,100,255,0.18)';
    ctx.beginPath();
    ctx.ellipse(player.x, player.y + player.h/2 + 4, 8, 5, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
    // Body
    drawTriangle(player.x, player.y, player.w*2, player.h*2, '#22aaff', '#00ffff');
    // Cockpit
    ctx.save();
    ctx.shadowColor = '#ffffff';
    ctx.shadowBlur  = 6;
    ctx.fillStyle   = '#cceeff';
    ctx.beginPath();
    ctx.ellipse(player.x, player.y, 4, 5, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  // Powerup timer bar
  if (player.spreadShot) {
    const frac = player.spreadTimer / player.SPREAD_DURATION;
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(W/2-70, H-10, 140, 5);
    ctx.fillStyle = '#ffdd00';
    ctx.shadowColor = '#ffaa00';
    ctx.shadowBlur  = 8;
    ctx.fillRect(W/2-70, H-10, 140*frac, 5);
    ctx.restore();
  }
}

function loop() {
  if (!gameRunning) return;
  update();
  draw();
  animId = requestAnimationFrame(loop);
}

// ─── Input ────────────────────────────────────────────────────────────────────
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ') e.preventDefault();
});
window.addEventListener('keyup',  e => { keys[e.key] = false; });

canvas.addEventListener('mousedown', e => { if (e.button===0) mouseDown=true; });
canvas.addEventListener('mouseup',   e => { if (e.button===0) mouseDown=false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());

// ─── Start / Restart ─────────────────────────────────────────────────────────
function startGame() {
  initGame();
  gameRunning = true;
  gameoverScreen.classList.remove('visible');
  if (animId) cancelAnimationFrame(animId);
  loop();
}

startBtn.addEventListener('click', () => {
  titleScreen.style.display = 'none';
  gameWrapper.style.display = 'block';
  startGame();
});

restartBtn.addEventListener('click', () => {
  startGame();
});
</script>
</body>
</html>
