<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D 俯視角射擊遊戲</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }
        canvas {
            display: block;
            background-color: #222;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .stats {
            position: absolute;
            top: 15px;
            font-size: 20px;
            font-weight: bold;
        }
        #score-display { left: 20px; color: #4CAF50; position: absolute; top: 15px; font-size: 20px; font-weight: bold; }
        #hp-display { right: 20px; color: #F44336; position: absolute; top: 15px; font-size: 20px; font-weight: bold; }
        
        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            display: none; /* 預設隱藏 */
        }
        #game-over-screen h1 {
            font-size: 48px;
            color: #F44336;
            margin-bottom: 10px;
        }
        #final-score {
            font-size: 24px;
            margin-bottom: 30px;
        }
        button {
            padding: 10px 30px;
            font-size: 20px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="ui-layer">
        <div id="score-display">分數: 0</div>
        <div id="hp-display">生命值: 3</div>
    </div>
    <div id="game-over-screen">
        <h1>GAME OVER</h1>
        <div id="final-score">最終分數: 0</div>
        <button id="restart-btn">重新開始</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreDisplay = document.getElementById('score-display');
    const hpDisplay = document.getElementById('hp-display');
    const gameOverScreen = document.getElementById('game-over-screen');
    const finalScoreDisplay = document.getElementById('final-score');
    const restartBtn = document.getElementById('restart-btn');

    // 遊戲狀態與變數
    let animationId;
    let score = 0;
    let isGameOver = false;
    let frames = 0;

    // 按鍵狀態追蹤
    const keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false };
    let isShooting = false;

    // 實體陣列
    let playerBullets = [];
    let enemyBullets = [];
    let enemies = [];
    let powerUps = [];

    // 事件監聽
    window.addEventListener('keydown', (e) => {
        if (keys.hasOwnProperty(e.key)) keys[e.key] = true;
        if (e.code === 'Space') isShooting = true;
    });
    window.addEventListener('keyup', (e) => {
        if (keys.hasOwnProperty(e.key)) keys[e.key] = false;
        if (e.code === 'Space') isShooting = false;
    });
    canvas.addEventListener('mousedown', (e) => { if (e.button === 0) isShooting = true; });
    window.addEventListener('mouseup', (e) => { if (e.button === 0) isShooting = false; });

    restartBtn.addEventListener('click', initGame);

    // --- 類別定義 ---

    class Player {
        constructor() {
            this.x = canvas.width / 2;
            this.y = canvas.height - 50;
            this.size = 15;
            this.speed = 5;
            this.hp = 3;
            this.cooldown = 15; // 射擊冷卻時間(幀)
            this.currentCooldown = 0;
            
            this.isInvincible = false;
            this.invincibleTimer = 0;
            
            this.hasShotgun = false;
            this.shotgunTimer = 0;
        }

        update() {
            // 移動邏輯，限制邊界
            if ((keys.w || keys.ArrowUp) && this.y - this.size > 0) this.y -= this.speed;
            if ((keys.s || keys.ArrowDown) && this.y + this.size < canvas.height) this.y += this.speed;
            if ((keys.a || keys.ArrowLeft) && this.x - this.size > 0) this.x -= this.speed;
            if ((keys.d || keys.ArrowRight) && this.x + this.size < canvas.width) this.x += this.speed;

            // 射擊邏輯
            if (this.currentCooldown > 0) this.currentCooldown--;
            if (isShooting && this.currentCooldown === 0) {
                this.shoot();
                this.currentCooldown = this.cooldown;
            }

            // 狀態計時器
            if (this.isInvincible) {
                this.invincibleTimer--;
                if (this.invincibleTimer <= 0) this.isInvincible = false;
            }
            if (this.hasShotgun) {
                this.shotgunTimer--;
                if (this.shotgunTimer <= 0) this.hasShotgun = false;
            }
        }

        draw() {
            // 受傷閃爍效果
            if (this.isInvincible && Math.floor(Date.now() / 100) % 2 === 0) return;

            ctx.fillStyle = '#2196F3'; // 藍色三角形
            ctx.beginPath();
            ctx.moveTo(this.x, this.y - this.size);
            ctx.lineTo(this.x - this.size, this.y + this.size);
            ctx.lineTo(this.x + this.size, this.y + this.size);
            ctx.closePath();
            ctx.fill();
        }

        shoot() {
            if (this.hasShotgun) {
                // 發射 3 發散彈
                const angles = [-0.2, 0, 0.2];
                angles.forEach(angle => {
                    const vx = Math.sin(angle) * 10;
                    const vy = -Math.cos(angle) * 10;
                    playerBullets.push(new Bullet(this.x, this.y - this.size, vx, vy, '#00BCD4'));
                });
            } else {
                // 單發子彈
                playerBullets.push(new Bullet(this.x, this.y - this.size, 0, -10, '#00BCD4'));
            }
        }

        hit() {
            if (this.isInvincible) return;
            this.hp--;
            hpDisplay.innerText = `生命值: ${this.hp}`;
            if (this.hp <= 0) {
                isGameOver = true;
            } else {
                this.isInvincible = true;
                this.invincibleTimer = 90; // 約 1.5 秒無敵
            }
        }
    }

    class Bullet {
        constructor(x, y, vx, vy, color, isEnemy = false) {
            this.x = x;
            this.y = y;
            this.vx = vx;
            this.vy = vy;
            this.radius = 4;
            this.color = color;
            this.markedForDeletion = false;
            this.isEnemy = isEnemy;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            // 飛出邊界則標記刪除
            if (this.y < 0 || this.y > canvas.height || this.x < 0 || this.x > canvas.width) {
                this.markedForDeletion = true;
            }
        }
        draw() {
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    class Enemy {
        constructor() {
            this.size = 20;
            this.x = Math.random() * (canvas.width - this.size * 2) + this.size;
            this.y = -this.size;
            this.speed = Math.random() * 1.5 + 0.5;
            this.markedForDeletion = false;
            this.shootTimer = Math.random() * 60 + 60; // 隨機開火間隔
        }
        update() {
            this.y += this.speed;
            if (this.y > canvas.height + this.size) this.markedForDeletion = true;

            // 瞄準玩家射擊
            this.shootTimer--;
            if (this.shootTimer <= 0 && this.y > 0) {
                const dx = player.x - this.x;
                const dy = player.y - this.y;
                const angle = Math.atan2(dy, dx);
                const bulletSpeed = 4;
                const vx = Math.cos(angle) * bulletSpeed;
                const vy = Math.sin(angle) * bulletSpeed;
                enemyBullets.push(new Bullet(this.x, this.y, vx, vy, '#FF9800', true));
                this.shootTimer = Math.random() * 120 + 60;
            }
        }
        draw() {
            ctx.fillStyle = '#F44336'; // 紅色方形
            ctx.fillRect(this.x - this.size/2, this.y - this.size/2, this.size, this.size);
        }
    }

    class PowerUp {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.radius = 10;
            this.speed = 2;
            this.markedForDeletion = false;
        }
        update() {
            this.y += this.speed;
            if (this.y > canvas.height + this.radius) this.markedForDeletion = true;
        }
        draw() {
            ctx.fillStyle = '#FFEB3B'; // 黃色圓形
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    let player;

    // --- 遊戲邏輯與迴圈 ---

    function initGame() {
        player = new Player();
        playerBullets = [];
        enemyBullets = [];
        enemies = [];
        powerUps = [];
        score = 0;
        frames = 0;
        isGameOver = false;
        isShooting = false;
        
        scoreDisplay.innerText = `分數: 0`;
        hpDisplay.innerText = `生命值: 3`;
        gameOverScreen.style.display = 'none';
        
        cancelAnimationFrame(animationId);
        gameLoop();
    }

    // 圓形/矩形簡易碰撞偵測
    function checkCollision(circle, rect) {
        let testX = circle.x;
        let testY = circle.y;
        
        if (circle.x < rect.x - rect.size/2) testX = rect.x - rect.size/2;
        else if (circle.x > rect.x + rect.size/2) testX = rect.x + rect.size/2;
        
        if (circle.y < rect.y - rect.size/2) testY = rect.y - rect.size/2;
        else if (circle.y > rect.y + rect.size/2) testY = rect.y + rect.size/2;
        
        const distX = circle.x - testX;
        const distY = circle.y - testY;
        const distance = Math.sqrt((distX*distX) + (distY*distY));
        
        return distance <= circle.radius;
    }

    // 圓形與圓形碰撞偵測 (玩家/掉落物, 玩家/子彈)
    function checkCircleCollision(c1, c2) {
        const dx = c1.x - c2.x;
        const dy = c1.y - c2.y;
        const distance = Math.sqrt(dx * dx + dy * dy);
        return distance < (c1.radius || c1.size) + (c2.radius || c2.size);
    }

    function handleCollisions() {
        // 1. 玩家子彈打中敵人
        playerBullets.forEach(bullet => {
            enemies.forEach(enemy => {
                if (!bullet.markedForDeletion && !enemy.markedForDeletion) {
                    if (checkCollision(bullet, enemy)) {
                        bullet.markedForDeletion = true;
                        enemy.markedForDeletion = true;
                        score += 10;
                        scoreDisplay.innerText = `分數: ${score}`;

                        // 30% 機率掉落強化道具
                        if (Math.random() < 0.3) {
                            powerUps.push(new PowerUp(enemy.x, enemy.y));
                        }
                    }
                }
            });
        });

        // 2. 敵人碰到玩家
        enemies.forEach(enemy => {
            if (!enemy.markedForDeletion && !player.isInvincible) {
                // 將玩家視為圓形來做簡化碰撞
                if (checkCollision({x: player.x, y: player.y, radius: player.size}, enemy)) {
                    enemy.markedForDeletion = true;
                    player.hit();
                }
            }
        });

        // 3. 敵人子彈打中玩家
        enemyBullets.forEach(bullet => {
            if (!bullet.markedForDeletion && !player.isInvincible) {
                if (checkCircleCollision(bullet, {x: player.x, y: player.y, radius: player.size})) {
                    bullet.markedForDeletion = true;
                    player.hit();
                }
            }
        });

        // 4. 玩家吃到強化道具
        powerUps.forEach(powerUp => {
            if (!powerUp.markedForDeletion) {
                if (checkCircleCollision(powerUp, {x: player.x, y: player.y, radius: player.size})) {
                    powerUp.markedForDeletion = true;
                    player.hasShotgun = true;
                    player.shotgunTimer = 600; // 約 10 秒散彈效果
                }
            }
        });
    }

    function gameLoop() {
        if (isGameOver) {
            finalScoreDisplay.innerText = `最終分數: ${score}`;
            gameOverScreen.style.display = 'flex';
            return; // 終止遊戲迴圈
        }

        // 清空畫布
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        frames++;

        // 定時生成敵人
        if (frames % 90 === 0) { // 每 1.5 秒生成一個
            enemies.push(new Enemy());
        }

        // 更新與繪製玩家
        player.update();
        player.draw();

        // 更新與繪製玩家子彈
        playerBullets.forEach(bullet => {
            bullet.update();
            bullet.draw();
        });
        playerBullets = playerBullets.filter(bullet => !bullet.markedForDeletion);

        // 更新與繪製敵人
        enemies.forEach(enemy => {
            enemy.update();
            enemy.draw();
        });
        enemies = enemies.filter(enemy => !enemy.markedForDeletion);

        // 更新與繪製敵人子彈
        enemyBullets.forEach(bullet => {
            bullet.update();
            bullet.draw();
        });
        enemyBullets = enemyBullets.filter(bullet => !bullet.markedForDeletion);

        // 更新與繪製掉落物
        powerUps.forEach(powerUp => {
            powerUp.update();
            powerUp.draw();
        });
        powerUps = powerUps.filter(powerUp => !powerUp.markedForDeletion);

        // 碰撞偵測
        handleCollisions();

        // 請求下一幀
        animationId = requestAnimationFrame(gameLoop);
    }

    // 啟動遊戲
    initGame();
</script>
</body>
</html>
